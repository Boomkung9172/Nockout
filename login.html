<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ & สมัครสมาชิก - SONGKHLA PUB (HTML Version)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { light: '#f7e096', DEFAULT: '#d4af37', dark: '#997819' },
                        night: { 900: '#090a0f', 800: '#13151d', 700: '#1b1d28', 600: '#262938' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold-gradient: linear-gradient(135deg, #f7e096 0%, #d4af37 50%, #997819 100%); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background-color: #090a0f; color: #e5e7eb; min-height: 100vh; }
        .text-gold-gradient { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gold { background: var(--gold-gradient); color: #0b0c10; font-weight: 600; transition: all 0.3s ease; border: none; }
        .btn-gold:hover { box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); transform: translateY(-2px); filter: brightness(1.1); }
        .glass-card { background: rgba(19, 21, 29, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 1.5rem; }
    </style>
</head>
<body class="bg-night-900 text-gray-200 flex flex-col min-h-screen">

<!-- Header -->
<header class="sticky top-0 z-50 bg-[#090a0f]/95 backdrop-blur-md border-b border-[#d4af37]/30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-yellow-500/20 to-yellow-900/40 flex items-center justify-center border border-[#d4af37]/50 shadow-lg">
                    <i class="fa-solid fa-champagne-glasses text-[#d4af37] text-xl"></i>
                </div>
                <div>
                    <div class="text-xl font-extrabold tracking-wider text-gold-gradient">SONGKHLA PUB</div>
                    <div class="text-[10px] text-gray-400 tracking-widest uppercase">Member Authentication</div>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="index.html" class="text-gray-300 hover:text-yellow-400 transition-colors">หน้าแรก</a>
                <a href="booking.html" class="text-gray-300 hover:text-yellow-400 transition-colors">จองโต๊ะ & ผังร้าน</a>
                <a href="my-bookings.html" class="text-gray-300 hover:text-yellow-400 transition-colors">ตั๋วการจองของฉัน</a>
                <a href="profile.html" class="text-gray-300 hover:text-yellow-400 transition-colors">แต้ม VIP / โปรไฟล์</a>
                <a href="contact.html" class="text-gray-300 hover:text-yellow-400 transition-colors">แชทติดต่อร้าน</a>
                <a href="admin.html" class="text-amber-300 hover:text-white px-3 py-1 rounded-lg bg-yellow-950/60 border border-yellow-500/40 text-xs font-bold transition-all">
                    👑 หลังบ้าน Admin
                </a>
            </nav>
        </div>
    </div>
</header>

<main class="flex-1 flex items-center justify-center p-4 py-12">
    
    <div class="glass-card max-w-md w-full p-8 space-y-6 border border-yellow-500/40 shadow-2xl">
        
        <!-- Toggle Tabs: Login vs Register -->
        <div class="flex p-1 rounded-xl bg-night-900 border border-gray-800 text-xs font-bold">
            <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2.5 rounded-lg bg-yellow-500 text-black shadow">
                เข้าสู่ระบบ (Login)
            </button>
            <button onclick="switchTab('register')" id="tabRegister" class="flex-1 py-2.5 rounded-lg text-gray-400 hover:text-white">
                สมัครสมาชิกใหม่ (+50 แต้ม)
            </button>
        </div>

        <!-- Login Form -->
        <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-gray-300 mb-1 font-semibold">อีเมลผู้ใช้ (Email):</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-gray-500"></i>
                    <input type="email" id="loginEmail" required value="user@gmail.com" placeholder="name@example.com" class="w-full bg-night-900 border border-gray-700 rounded-xl pl-10 pr-4 py-2.5 text-white focus:border-yellow-400 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-gray-300 mb-1 font-semibold">รหัสผ่าน (Password):</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-500"></i>
                    <input type="password" id="loginPass" required value="1234" placeholder="••••••••" class="w-full bg-night-900 border border-gray-700 rounded-xl pl-10 pr-4 py-2.5 text-white focus:border-yellow-400 focus:outline-none">
                </div>
            </div>

            <button type="submit" class="w-full btn-gold py-3 rounded-xl font-bold text-sm shadow-xl flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
            </button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-3.5 text-xs hidden">
            <div>
                <label class="block text-gray-300 mb-1 font-semibold">ชื่อ-นามสกุล:</label>
                <input type="text" required placeholder="นายรักสนุก สุขภาพดี" class="w-full bg-night-900 border border-gray-700 rounded-xl px-3.5 py-2 text-white focus:border-yellow-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-gray-300 mb-1 font-semibold">เบอร์โทรศัพท์ (สำหรับยืนยันโต๊ะ):</label>
                <input type="tel" required placeholder="08x-xxx-xxxx" class="w-full bg-night-900 border border-gray-700 rounded-xl px-3.5 py-2 text-white focus:border-yellow-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-gray-300 mb-1 font-semibold">อีเมล:</label>
                <input type="email" required placeholder="example@gmail.com" class="w-full bg-night-900 border border-gray-700 rounded-xl px-3.5 py-2 text-white focus:border-yellow-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-gray-300 mb-1 font-semibold">รหัสผ่าน:</label>
                <input type="password" required placeholder="กำหนดรหัสผ่าน" class="w-full bg-night-900 border border-gray-700 rounded-xl px-3.5 py-2 text-white focus:border-yellow-400 focus:outline-none">
            </div>
            <button type="submit" class="w-full btn-gold py-3 rounded-xl font-bold text-sm shadow-xl">
                สมัครสมาชิกและรับโบนัส 50 แต้ม
            </button>
        </form>

        <!-- Quick One-Click Fill Buttons for Teacher / Evaluation -->
        <div class="pt-4 border-t border-gray-800 space-y-2">
            <div class="text-[11px] text-gray-400 text-center">คลิกปุ่มเพื่อเติมบัญชีทดสอบทันที:</div>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="quickFill('user@gmail.com', '1234')" class="p-2.5 rounded-xl bg-night-900 border border-gray-800 hover:border-yellow-500 text-left transition-all">
                    <div class="font-bold text-yellow-400 text-xs">👤 ลูกค้า (User)</div>
                    <div class="text-[10px] text-gray-400 truncate">user@gmail.com</div>
                </button>
                <button type="button" onclick="quickFill('674295003@parichat.skru.ac.th', '1234')" class="p-2.5 rounded-xl bg-night-900 border border-amber-500/40 hover:border-amber-400 text-left transition-all">
                    <div class="font-bold text-amber-300 text-xs">👑 แอดมิน (Admin)</div>
                    <div class="text-[10px] text-gray-400 truncate">674295003@...</div>
                </button>
            </div>
        </div>

    </div>

</main>

<footer class="bg-[#07080b] border-t border-[#d4af37]/20 py-6 text-center text-xs text-gray-500 mt-auto">
    <p>© 2026 SONGKHLA PUB & BAR RESERVATION • HTML Evaluation Package</p>
</footer>

<script>
    function switchTab(mode) {
        if(mode === 'login') {
            document.getElementById('tabLogin').className = 'flex-1 py-2.5 rounded-lg bg-yellow-500 text-black shadow font-bold';
            document.getElementById('tabRegister').className = 'flex-1 py-2.5 rounded-lg text-gray-400 hover:text-white font-bold';
            document.getElementById('formLogin').classList.remove('hidden');
            document.getElementById('formRegister').classList.add('hidden');
        } else {
            document.getElementById('tabRegister').className = 'flex-1 py-2.5 rounded-lg bg-yellow-500 text-black shadow font-bold';
            document.getElementById('tabLogin').className = 'flex-1 py-2.5 rounded-lg text-gray-400 hover:text-white font-bold';
            document.getElementById('formRegister').classList.remove('hidden');
            document.getElementById('formLogin').classList.add('hidden');
        }
    }

    function quickFill(email, pass) {
        switchTab('login');
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPass').value = pass;
    }

    function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        if(email.includes('parichat') || email.includes('admin')) {
            alert('👑 เข้าสู่ระบบในฐานะ Admin สำเร็จ! กำลังนำคุณไปยังห้องควบคุมหลังบ้าน');
            window.location.href = 'admin.html';
        } else {
            alert('🎉 เข้าสู่ระบบสำเร็จ ยินดีต้อนรับคุณ ' + email);
            window.location.href = 'booking.html';
        }
    }

    function handleRegister(e) {
        e.preventDefault();
        alert('🎉 สมัครสมาชิกใหม่สำเร็จ! คุณได้รับโบนัส 50 แต้มสะสม VIP');
        window.location.href = 'profile.html';
    }
</script>
</body>
</html>
